<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">
    <meta
        name="description"
        content="MathCore — a modern mathematical computing engine.">

    <title>AMORAH CALC — Mathematical Computing Engine</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <header class="app-header">
        <div class="brand">
            <h1>AMORAH CALC</h1>
            <span>Mathematical Computing Engine</span>
        </div>
        <div class="header-actions">
            <button id="theme-toggle" type="button">
                Theme
            </button>
            <button id="settings-button" type="button">
                Settings
            </button>
        </div>
    </header>
    <main class="app">

        <!-- Calculator -->

        <section class="calculator" aria-label="Calculator">
            <div class="display">
                <input
                    id="expression"
                    class="expression"
                    type="text"
                    placeholder="Enter an expression..."
                    autocomplete="off"
                    autocapitalize="off"
                    spellcheck="false"
                    aria-label="Mathematical expression">
                </input>
                <div
                    id="result"
                    class="result"
                    aria-live="polite">
                    0
                </div>
            </div>

            <!-- Calculator controls -->

            <div class="calculator-body">
                <div
                    id="keypad"
                    class="keypad"
                    aria-label="Calculator keypad">
                    <button 
                       class="key function"
                       data-value="sin(">sin</button>
                       <button class="key function"
                       data-value="cos(">cos</button>
                       <button class="key function"
                       data-value="tan(">tan</button>
                       <button class="key function"
                       data-value="In(">In</button>
                       <button class="key function"
                       data-value="log(">log</button>
                       <button class="key function"
                       data-value="sqrt(">&radic;</button>
                       <button class="key function"
                       data-value="pi">&pi;</button>
                       <button class="key function"
                       data-value="e">e</button>
                       <button class="key operator"
                       data-value="^">x^y</button>
                       <button class="key operator"
                       data-value="/">&divide;</button>
                       <button class="key operator"
                       data-value="*">&times;</button>
                       <button class="key action"
                       data-action="backspace">&#9003;</button>
                       <button class="key" data-value="(">(</button>
                       <button class="key" data-value=")">)</button>
                       <button class="key action" data-action="clear">AC</button>
                       <button class="key operator"
                       data-value="-">-</button>
                       <button class="key operator"
                       data-value="+">+</button>
                       <button class="key action"
                       data-action="clear">C</button>
                       <button class="key" data-value="7">7</button>
                       <button class="key" data-value="8">8</button>
                       <button class="key" data-value="9">9</button>
                       <button class="key" data-value="4">4</button>
                       <button class="key" data-value="5">5</button>
                       <button class="key" data-value="6">6</button>
                       <button class="key" data-value="1">1</button>
                       <button class="key" data-value="2">2</button>
                       <button class="key" data-value="3">3</button>
                       <button class="key wide" data-value="0">0</button>
                       <button class="key" data-value=".">.</button>

                       <button
                          id="calculate-button"
                          class="key equal"
                          data-action="calculate"
                          type="button">=</button>
                </div>
            </div>
        </section>

        <!-- History -->

        <aside class="history-panel">
            <div class="panel-header">
                <h2>History</h2>
                <button
                    id="clear-history"
                    type="button">
                    Clear
                </button>
              </div>
            <div
                id="history"
                class="history-list">
                <!-- History entries will appear here -->

            </div>
        </aside>

        <!-- Mathematical explanation -->

        <section class="explanation-panel">
            <div class="panel-header">
                <h2>Explanation</h2>
            </div>
            <div
                id="explanation"
                class="explanation-content"
            >
                <p>
                    Your mathematical steps will appear here.
                </p>
            </div>
        </section>
    </main>
    <script type="module" src="./js/main.js"></script>
</body>
</html>
